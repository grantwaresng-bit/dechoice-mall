name: dechoice_mall
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  provider: ^6.1.2
  share_plus: ^10.0.0
  flutterwave_standard: ^1.1.0
  flutter_paystack_fork: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  shared_preferences: ^2.3.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
   # - .env
    - assets/images/
    - assets/icon/
    - assets/logo.jpeg

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.jpeg"
  android: true
  ios: true