<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shop vibrant kids' fashion and tasty fast foods at Dechoice, your friendly neighborhood mall bringing fresh styles and flavors together.">

  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dechoicemall.com">
  <meta property="og:title" content="Dechoice Mall – Family Shopping & Eats">
  <meta property="og:description" content="Shop vibrant kids' fashion and tasty fast foods at Dechoice, your friendly neighborhood mall bringing fresh styles and flavors together. Check out Dechoice Mall! Shop your favorite provisions, meals, drinks and more.">
  <meta property="og:image" content="https://dechoicemall.com/app_icon.jpeg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dechoice Mall – Family Shopping & Eats">
  <meta name="twitter:description" content="Shop vibrant kids' fashion and tasty fast foods at Dechoice, your friendly neighborhood mall bringing fresh styles and flavors together.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dechoice Mall">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dechoice Mall</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
